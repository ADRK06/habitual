<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Web sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 240px; height: 900px; box-sizing: border-box; padding: 24px 16px; display: flex; flex-direction: column; gap: 24px; background: #0C0F14; color: #ECE6D8; font-family: 'IBM Plex Sans', sans-serif">
  <a href="WebLanding.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #ECE6D8">
    <img src="../art/93037739eedb431e18db41628feb2b0b.png" alt="" style="width: 32px; height: 32px; image-rendering: pixelated">
    <span style="font-family: 'Silkscreen', monospace; font-size: 16px; font-weight: 700; letter-spacing: 1px">HABITUAL</span>
  </a>

  <a href="WebProfile.dc.html" style="display: flex; flex-direction: column; gap: 10px; padding: 12px; background: #141922; border: 1px solid #2A3140; text-decoration: none; color: #ECE6D8">
    <span style="display: flex; align-items: center; gap: 10px">
      <img src="../art/fda5c80c9eef2e7a17d948ec9e53f848.png" alt="" style="width: 40px; height: 40px; image-rendering: pixelated; border: 1px solid #FFB238">
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'Silkscreen', monospace; font-size: 12px">CMDR. NOVA</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #9A9384">Captain · LV 12</span>
      </span>
    </span>
    <span style="height: 4px; background: #2A3140; display: block"><span style="display: block; width: 62%; height: 4px; background: #FFB238"></span></span>
    <span style="display: flex; gap: 8px">
      <span style="display: flex; align-items: center; gap: 6px; flex-grow: 1; height: 28px; padding: 0 8px; border: 1px solid #2A3140; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #FFB238"><svg width="10" height="12" viewBox="0 0 12 14" aria-hidden="true"><path d="M7 0 1 8h4l-1 6 6-8H6z" fill="#FFB238"></path></svg>340</span>
      <span style="display: flex; align-items: center; gap: 6px; flex-grow: 1; height: 28px; padding: 0 8px; border: 1px solid #2A3140; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #E2603A"><svg width="10" height="12" viewBox="0 0 12 14" aria-hidden="true"><path d="M6 0c1 3 5 5 5 9a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-8z" fill="#E2603A"></path></svg>14d</span>
    </span>
  </a>

  <nav aria-label="Main" style="display: flex; flex-direction: column; gap: 2px">
    <sc-for list="{{items}}" as="item" hint-placeholder-count="7">
      <a href="{{item.href}}" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; text-decoration: none; font-family: 'Silkscreen', monospace; font-size: 12px; color: {{item.color}}; background: {{item.bg}}; border-left: 2px solid {{item.bar}}"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="{{item.d}}"></path></svg>{{item.label}}</a>
    </sc-for>
  </nav>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 6px; padding: 12px; border: 1px solid #2A3140">
    <span style="font-family: 'Silkscreen', monospace; font-size: 11px; color: #9A9384">THIS WEEK</span>
    <span style="font-size: 13px">Nebula sector · <span style="font-family: 'IBM Plex Mono', monospace; color: #8BD7A0">#4 of 30</span></span>
    <span style="font-size: 12px; color: #9A9384">Resets in 2d 6h</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["colony","habits","fleet","sector","galaxy","shop","profile"],"default":"colony"},"$preview":{"width":240,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'colony';
    const list = [
      { k: 'colony', label: 'COLONY', href: 'WebHome.dc.html', d: 'M10 4a6 6 0 1 0 0 12a6 6 0 1 0 0-12M2 12c4 2 12 0 16-4' },
      { k: 'habits', label: 'HABITS', href: 'WebHabits.dc.html', d: 'M4 5h12M4 10h12M4 15h8' },
      { k: 'fleet', label: 'FLEET', href: 'WebFleet.dc.html', d: 'M10 3 4 15l6-3 6 3z' },
      { k: 'sector', label: 'SECTOR', href: 'WebSector.dc.html', d: 'M4 16V9M10 16V4M16 16v-5' },
      { k: 'galaxy', label: 'GALAXY', href: 'WebGalaxy.dc.html', d: 'M3 10h14M10 3v14M5 5l10 10M15 5 5 15' },
      { k: 'shop', label: 'SHOP', href: 'WebShop.dc.html', d: 'M4 7h12l-1 9H5zM7 7a3 3 0 0 1 6 0' },
      { k: 'profile', label: 'COMMANDER', href: 'WebProfile.dc.html', d: 'M10 3a3 3 0 1 0 0 6a3 3 0 1 0 0-6M4 17c1-4 11-4 12 0' }
    ];
    return { items: list.map((i) => ({ ...i, color: i.k === a ? '#FFB238' : '#9A9384', bg: i.k === a ? '#141922' : 'transparent', bar: i.k === a ? '#FFB238' : 'transparent' })) };
  }
}
</script>
</body>
</html>
