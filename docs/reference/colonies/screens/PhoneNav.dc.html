<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone tab bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Main" style="width: 390px; height: 64px; box-sizing: border-box; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid #2A3140; background: #0C0F14; font-family: 'Silkscreen', monospace; color: #9A9384">
  <sc-for list="{{items}}" as="item" hint-placeholder-count="5">
    <a href="{{item.href}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; font-size: 10px; color: {{item.color}}; border-top: 2px solid {{item.bar}}"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="{{item.d}}"></path></svg>{{item.label}}</a>
  </sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["colony","habits","fleet","ranks","galaxy"],"default":"colony"},"$preview":{"width":390,"height":64}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'colony';
    const list = [
      { k: 'colony', label: 'COLONY', href: 'PhoneHome.dc.html', d: 'M10 4a6 6 0 1 0 0 12a6 6 0 1 0 0-12M2 12c4 2 12 0 16-4' },
      { k: 'habits', label: 'HABITS', href: 'PhoneHabits.dc.html', d: 'M4 5h12M4 10h12M4 15h8' },
      { k: 'fleet', label: 'FLEET', href: 'PhoneFleet.dc.html', d: 'M10 3 4 15l6-3 6 3z' },
      { k: 'ranks', label: 'RANKS', href: 'PhoneSector.dc.html', d: 'M4 16V9M10 16V4M16 16v-5' },
      { k: 'galaxy', label: 'GALAXY', href: 'PhoneGalaxy.dc.html', d: 'M3 10h14M10 3v14M5 5l10 10M15 5 5 15' }
    ];
    return { items: list.map((i) => ({ ...i, color: i.k === a ? '#FFB238' : '#9A9384', bar: i.k === a ? '#FFB238' : 'transparent' })) };
  }
}
</script>
</body>
</html>
