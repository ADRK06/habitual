      <div style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; background: #141922; border: 1px solid #2A3140; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #E2603A"><svg width="12" height="14" viewBox="0 0 12 14" aria-hidden="true"><path d="M6 0c1 3 5 5 5 9a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-8z" fill="#E2603A"></path></svg>14</div>

    <div style="display: flex; justify-content: space-between; align-items: baseline">

      </div>
      <div style="display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 12px; background: #141922; border: 1px solid #2A3140">

        <div style="display: flex; flex-direction: column; flex-grow: 1"><div style="font-size: 14px; font-weight: 500; color: #9A9384; text-decoration: line-through">Read 20 pages</div><div style="font-size: 12px; color: #9A9384">Research Lab</div></div>

      <div style="display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 6px 0 12px; background: #141922; border: 1px solid #FFB238">
        <div style="width: 10px; height: 10px; background: #3E5A7A"></div>
        <div style="display: flex; flex-direction: column; flex-grow: 1"><div style="font-size: 14px; font-weight: 500; color: #ECE6D8">Drink 8 glasses</div><div style="font-size: 12px; color: #9A9384">Biodome</div></div>
        <button type="button" style="height: 40px; padding: 0 12px; background: #FFB238; color: #0C0F14; border: 0; font-family: 'Silkscreen', monospace; font-size: 12px; cursor: pointer">+5</button>

    </div>

    <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #FFB238; text-decoration: none; font-family: 'Silkscreen', monospace; font-size: 10px"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="10" cy="10" r="6"></circle><path d="M2 12c4 2 12 0 16-4"></path></svg>COLONY</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #9A9384; text-decoration: none; font-family: 'Silkscreen', monospace; font-size: 10px"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 5h12M4 10h12M4 15h8"></path></svg>HABITS</a>
