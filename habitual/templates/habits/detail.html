{% extends "app_base.html" %}

{% block title %}{{ habit.title }} · Habitual{% endblock %}

{% block app_content %}
<div class="py-10">
  <a href="{{ url_for('habits.dashboard') }}" class="inline-flex items-center gap-1 text-sm text-text-muted transition-colors hover:text-text">
    ← Back to dashboard
  </a>

  <div class="mt-6 flex items-center gap-3">
    <span class="text-4xl">{{ habit.emoji }}</span>
    <h1 class="font-heading text-2xl font-semibold text-text">{{ habit.title }}</h1>
  </div>

  <div class="mt-10 rounded-2xl border border-dashed border-border bg-surface/30 px-6 py-16 text-center">
    <p class="text-text-muted">The full analytics page — completion ring, heatmap, insights — lands in Phase 3.</p>
  </div>
</div>
{% endblock %}
