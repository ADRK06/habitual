{% extends "base.html" %}

{% block title %}Dashboard · Habitual{% endblock %}

{% block content %}
<div class="flex min-h-screen flex-col items-center justify-center gap-6 px-6 text-center">
  <h1 class="font-heading text-3xl font-semibold text-text">Welcome, {{ current_user.name }}</h1>
  <p class="text-text-muted">The real dashboard (habits, streaks, points) is built in Phase 2.</p>

  <form method="post" action="{{ url_for('auth.logout') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit" class="rounded-2xl border border-border bg-surface/60 backdrop-blur px-5 py-2 font-medium text-text transition hover:bg-surface">
      Log out
    </button>
  </form>
</div>
{% endblock %}
