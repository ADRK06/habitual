<div
  id="badges-row"
  {% if oob %}hx-swap-oob="true"{% endif %}
  class="flex w-full flex-nowrap items-center gap-3 overflow-x-auto pb-6 font-body"
>
  <span class="shrink-0 font-display text-[10px] uppercase tracking-wide text-text-muted">Badges</span>
  {% for b in badge_rows %}
  <div class="group relative shrink-0">
    <button
      type="button"
      tabindex="0"
      aria-label="{{ b.label }}{{ ' - earned' if b.earned else ' (locked) - ' + b.hint }}"
      class="flex h-10 w-10 items-center justify-center border text-lg transition-transform duration-150 hover:scale-110
        {{ 'border-accent bg-accent/15' if b.earned else 'border-border bg-void grayscale opacity-40' }}"
    >
      {{ b.emoji }}
    </button>
    <div
      role="tooltip"
      class="pointer-events-none absolute left-1/2 top-full z-20 mt-2 w-44 -translate-x-1/2 border border-border bg-surface px-3 py-2 text-center opacity-0 transition duration-150 group-hover:opacity-100 group-focus-within:opacity-100"
    >
      <p class="font-display text-[11px] uppercase text-text">{{ b.label }}</p>
      <p class="mt-0.5 text-[11px] text-text-muted">
        {{ "Earned " + b.earned_on.strftime("%b %-d, %Y") if b.earned else b.hint }}
      </p>
    </div>
  </div>
  {% endfor %}
</div>
