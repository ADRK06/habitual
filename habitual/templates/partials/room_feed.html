<ol id="room-feed" {% if oob %}hx-swap-oob="true"{% endif %} class="mt-4 divide-y divide-border">
  {% if feed %}
    {% for item in feed %}{% include "partials/room_feed_item.html" %}{% endfor %}
  {% else %}
  <li class="flex flex-col items-center gap-2 py-10 text-center">
    <span class="flex h-10 w-10 items-center justify-center bg-steel/10 text-xl" aria-hidden="true">🏁</span>
    <p class="font-body text-sm text-text-muted">No check-ins yet - be the first!</p>
  </li>
  {% endif %}
</ol>
