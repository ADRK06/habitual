<div id="header-stats" {% if oob %}hx-swap-oob="true"{% endif %} class="flex flex-wrap items-center gap-4 sm:gap-6">
  <div class="text-right">
    <p class="text-xs text-text-muted">Earned points</p>
    <p id="earned-points-value" class="font-display text-3xl font-bold text-accent" data-counter="{{ earned_points }}">{{ earned_points }}</p>
  </div>
  <div class="text-right">
    <p class="text-xs text-text-muted">Balance</p>
    <p class="text-lg font-medium text-text">{{ balance }}</p>
  </div>
  <div class="text-right">
    <p class="text-xs text-text-muted">Freezes</p>
    <div class="flex items-center justify-end gap-2">
      <p class="text-lg font-medium text-text">🧊 {{ freezes_held }}/2</p>
      <button
        type="button"
        hx-post="{{ url_for('habits.buy_freeze') }}"
        hx-target="#header-stats"
        hx-swap="outerHTML"
        {% if not can_buy_freeze %}disabled title="{{ freeze_buy_disabled_reason }}"{% endif %}
        class="rounded-lg border border-border px-2 py-1 text-xs font-medium text-text transition hover:bg-bg/40 disabled:cursor-not-allowed disabled:opacity-40 disabled:hover:bg-transparent"
      >
        Buy
      </button>
    </div>
  </div>
</div>
