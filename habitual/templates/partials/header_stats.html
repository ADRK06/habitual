{% from "_macros.html" import spinner %}
<div
  id="header-stats"
  {% if oob %}hx-swap-oob="true"{% endif %}
  class="grid grid-cols-[repeat(3,auto)] items-baseline justify-items-end gap-x-5 gap-y-1 sm:gap-x-8"
>
  <p class="text-xs text-text-muted">Earned points</p>
  <p class="text-xs text-text-muted">Balance</p>
  <p class="text-xs text-text-muted">Freezes</p>

  <p id="earned-points-value" class="font-heading text-3xl font-bold tabular-nums text-accent" data-counter="{{ earned_points }}">{{ earned_points }}</p>
  <p class="text-lg font-medium text-text">{{ balance }}</p>
  <div class="flex items-baseline gap-2">
    <p class="text-lg font-medium text-text">🧊 {{ freezes_held }}/2</p>
    <button
      type="button"
      {% if can_buy_freeze %}
      hx-post="{{ url_for('habits.buy_freeze') }}"
      hx-target="#header-stats"
      hx-swap="outerHTML"
      hx-disabled-elt="this"
      {% else %}
      disabled title="{{ freeze_buy_disabled_reason }}"
      {% endif %}
      class="relative rounded-lg border border-border px-2 py-1 text-xs font-medium text-text transition hover:bg-bg/40 disabled:cursor-not-allowed disabled:opacity-40 disabled:hover:bg-transparent"
    >
      <span class="btn-label">Buy</span>
      {{ spinner(size='3') }}
    </button>
  </div>
</div>
