{% from "_macros.html" import spinner %}
<div
  id="header-stats"
  {% if oob %}hx-swap-oob="true"{% endif %}
  class="flex flex-wrap items-baseline gap-x-5 gap-y-1 pb-4 font-body text-xs text-text-muted"
>
  <span class="flex items-baseline gap-1.5">
    <span id="earned-points-value" class="font-mono text-xl font-bold tabular-nums text-accent" data-counter="{{ earned_points }}">{{ earned_points }}</span>
    Energy earned
  </span>
  <span class="flex items-baseline gap-1.5">
    <span class="font-mono text-sm text-text">{{ balance }}</span>
    Balance
  </span>
  <span class="flex items-baseline gap-1.5">
    <span class="font-mono text-sm text-text">🧊 {{ freezes_held }}/2</span>
    Freezes
    <button
      type="button"
      {% if can_buy_freeze %}
      hx-post="{{ url_for('habits.buy_freeze') }}"
      hx-target="#header-stats"
      hx-swap="outerHTML"
      hx-disabled-elt="this"
      {% else %}
      disabled title="{{ freeze_buy_disabled_reason }}"
      {% endif %}
      class="relative border border-border px-2 py-0.5 font-display text-[10px] uppercase text-text transition hover:border-accent disabled:cursor-not-allowed disabled:opacity-40"
    >
      <span class="btn-label">Buy</span>
      {{ spinner(size='3') }}
    </button>
  </span>
</div>
