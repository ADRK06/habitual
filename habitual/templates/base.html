<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <meta name="description" content="{% block meta_description %}Play your habits. Build habits that actually stick with Habitual.{% endblock %}">
  <title>{% block title %}Habitual{% endblock %}</title>

  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Exo+2:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">

  <script src="https://unpkg.com/htmx.org@2.0.10/dist/htmx.min.js"></script>
  <!-- Alpine plugins must load before Alpine's own core script. The Focus
       plugin gives every modal/popover real `x-trap` behavior: cycles Tab
       inside it, autofocuses its first focusable element, and restores
       focus to whatever triggered it when the trap releases - the official,
       tested way to do this rather than hand-rolling it per modal. -->
  <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/focus@3.17.4/dist/cdn.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.4/dist/cdn.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/Flip.min.js"></script>
  <script src="https://unpkg.com/lucide@1.48.0/dist/umd/lucide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>

  <script>
    window.prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    document.addEventListener("htmx:configRequest", (event) => {
      event.detail.headers["X-CSRFToken"] = document.querySelector('meta[name="csrf-token"]').content;
    });

    // A swapped-in habit/room card ships its check-in/undo popover inside a
    // <template x-teleport="body"> (habit_card.html, room_my_panel.html) -
    // Alpine clones that template's content into <body> itself, on its own
    // MutationObserver tick, which runs *after* htmx's own per-swap
    // htmx.process() call has already finished with the swapped subtree.
    // The clone's hx-delete/hx-post button renders and looks clickable, but
    // htmx never wired a request handler to it - clicking Undo right after
    // a check-in (no full page reload in between) silently did nothing.
    // htmx:afterSettle fires after htmx's settle delay specifically so
    // other libraries can finish reacting to the swap first, so Alpine's
    // teleport has already landed by now - re-processing the whole document
    // here (cheap, and a no-op for anything already bound) picks it up.
    document.addEventListener("htmx:afterSettle", () => {
      htmx.process(document.body);
    });

    // Plain (non-htmx) forms don't get htmx's hx-disabled-elt for free -
    // disable their submit button on submit so a slow request (or an
    // impatient double-click/double-Enter) can't fire it twice. Native
    // required-field validation blocks the submit event entirely when it
    // fails, so this never leaves a button stuck disabled on a blocked
    // submit. No re-enable needed either: a plain form submit always either
    // navigates away or reloads the page.
    document.addEventListener("submit", (event) => {
      const form = event.target;
      if (form.matches("[hx-post],[hx-get],[hx-put],[hx-patch],[hx-delete]")) return;
      const button = form.querySelector('button[type="submit"]');
      if (button) {
        button.disabled = true;
        button.classList.add("is-submitting");
      }
    });

    // Positions a small anchored popover (the check-in note / undo-confirm
    // dropdowns on habit cards) as a `position: fixed` box teleported to
    // <body> - a card in a CSS grid row has no z-index of its own, so an
    // `absolute` popover nested inside it can never paint above a *different*
    // card that happens to come later in the grid (each grid item paints as
    // its own unit; z-index on a descendant only wins against siblings
    // within the same stacking context). Teleporting sidesteps that
    // entirely. Flips above the trigger when there isn't room below, and
    // clamps both axes to stay fully inside the viewport.
    window.positionCardPopover = function positionCardPopover(triggerEl, popoverEl, gap = 8) {
      if (!triggerEl || !popoverEl) return;
      const margin = 8;
      const rect = triggerEl.getBoundingClientRect();
      const popoverHeight = popoverEl.offsetHeight;
      const viewportHeight = window.innerHeight;
      const viewportWidth = window.innerWidth;

      const spaceBelow = viewportHeight - rect.bottom;
      const openUpward = spaceBelow < popoverHeight + gap && rect.top > popoverHeight + gap;
      const top = openUpward ? rect.top - popoverHeight - gap : rect.bottom + gap;

      const width = rect.width;
      const left = Math.min(Math.max(rect.left, margin), viewportWidth - width - margin);

      popoverEl.style.position = "fixed";
      popoverEl.style.top = `${Math.max(Math.min(top, viewportHeight - popoverHeight - margin), margin)}px`;
      popoverEl.style.left = `${Math.max(left, margin)}px`;
      popoverEl.style.width = `${width}px`;
      popoverEl.style.margin = "0";
    };
  </script>

  {% block head %}{% endblock %}
</head>
<body class="min-h-screen antialiased">
  <a href="#content" class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-50 focus:rounded-lg focus:bg-surface focus:px-4 focus:py-2 focus:text-text focus:border focus:border-border">
    Skip to content
  </a>

  <script type="application/json" id="flashed-messages">{{ get_flashed_messages(with_categories=true) | tojson }}</script>
  <script type="application/json" id="newly-badges">{{ (newly_awarded_badges or [])|tojson }}</script>

  <div
    x-data="{
      toasts: [],
      nextId: 1,
      push(message, type = 'info') {
        const id = this.nextId++;
        this.toasts.push({ id, message, type });
        setTimeout(() => this.remove(id), 4000);
      },
      remove(id) {
        this.toasts = this.toasts.filter((t) => t.id !== id);
      },
    }"
    x-init="
      JSON.parse(document.getElementById('flashed-messages').textContent).forEach(([category, message]) => push(message, category));
      window.addEventListener('toast', (e) => push(e.detail.message, e.detail.type || 'info'));
    "
    role="status"
    aria-live="polite"
    class="fixed top-4 right-4 z-50 flex flex-col gap-2 w-80"
  >
    <template x-for="toast in toasts" :key="toast.id">
      <div
        x-show="true"
        x-transition:enter="transition ease-out"
        x-transition:enter-start="opacity-0 translate-y-2"
        x-transition:enter-end="opacity-100 translate-y-0"
        x-transition:leave="transition ease-in"
        x-transition:leave-start="opacity-100"
        x-transition:leave-end="opacity-0"
        class="rounded-2xl border border-border bg-surface/90 backdrop-blur px-4 py-3 text-sm shadow-lg flex items-start justify-between gap-3"
        :class="{
          'border-accent/50': toast.type === 'success',
          'border-danger/50': toast.type === 'error',
        }"
      >
        <span x-text="toast.message"></span>
        <button @click="remove(toast.id)" class="text-text-muted hover:text-text" aria-label="Dismiss">&times;</button>
      </div>
    </template>
  </div>

  <div
    x-data="{
      queue: [],
      current: null,
      showNext() {
        if (this.current || !this.queue.length) return;
        this.current = this.queue.shift();
        if (window.confetti && !window.prefersReducedMotion) {
          confetti({ particleCount: 140, spread: 90, startVelocity: 45, origin: { y: 0.4 } });
        }
      },
      dismiss() {
        this.current = null;
        this.$nextTick(() => this.showNext());
      },
    }"
    x-init="
      window.addEventListener('badgesEarned', (e) => { queue.push(...e.detail); showNext(); });
      const initialBadges = JSON.parse(document.getElementById('newly-badges').textContent || '[]');
      if (initialBadges.length) { queue.push(...initialBadges); showNext(); }
    "
    x-show="current"
    x-trap="!!current"
    x-cloak
    @keydown.escape.window="if (current) dismiss()"
    class="fixed inset-0 z-[60] flex items-center justify-center bg-black/70 p-4"
  >
    <template x-if="current">
      <div
        @click.outside="dismiss()"
        role="dialog"
        aria-modal="true"
        aria-labelledby="badge-modal-heading"
        x-transition:enter="transition ease-out duration-200"
        x-transition:enter-start="opacity-0 scale-95"
        x-transition:enter-end="opacity-100 scale-100"
        class="w-full max-w-sm rounded-2xl border border-accent/40 bg-surface p-8 text-center shadow-2xl"
      >
        <p class="font-heading text-xs font-semibold uppercase tracking-wider text-accent">Badge unlocked</p>
        <div class="mx-auto mt-4 flex h-20 w-20 items-center justify-center rounded-full bg-accent/15 text-4xl" x-text="current.emoji"></div>
        <h3 id="badge-modal-heading" class="mt-4 font-heading text-xl font-semibold text-text" x-text="current.label"></h3>
        <p class="mt-1 text-sm text-text-muted" x-text="current.hint"></p>
        <button
          type="button"
          @click="dismiss()"
          class="mt-6 w-full rounded-2xl bg-accent px-5 py-2.5 text-sm font-medium text-bg transition hover:opacity-90"
        >
          Nice!
        </button>
      </div>
    </template>
  </div>

  <main id="content">
    {% block content %}{% endblock %}
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => lucide.createIcons());
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
