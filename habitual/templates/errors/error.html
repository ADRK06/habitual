{% extends "base.html" %}

{% block title %}{{ title }} · Habitual{% endblock %}

{% block content %}
<div class="relative flex min-h-screen flex-col items-center justify-center gap-10 px-4 py-12">
  <a href="{{ url_for('home') }}" class="flex items-center gap-2.5 no-underline text-text">
    <img src="{{ url_for('static', filename='art/logo-mark.png') }}" alt="" class="h-8 w-8" style="image-rendering: pixelated">
    <span class="font-display text-lg uppercase tracking-wide">Habitual</span>
  </a>

  <div id="error-card" class="relative w-full max-w-sm border border-border bg-surface p-8 text-center">
    <div class="mx-auto flex h-16 w-16 items-center justify-center border border-accent/40 bg-accent/10 text-3xl" aria-hidden="true">{{ emoji }}</div>
    <p class="mt-4 font-mono text-5xl tabular-nums text-accent">{{ code }}</p>
    <h1 class="mt-2 font-display text-xl uppercase tracking-wide text-text">{{ title }}</h1>
    <p class="mt-2 font-body text-sm text-text-muted">{{ message }}</p>
    <a
      href="{{ url_for('home') }}"
      class="mt-6 inline-block w-full bg-accent px-4 py-2 font-display text-xs uppercase tracking-wide text-bg transition-transform duration-150 hover:opacity-90 hover:scale-[1.02] active:scale-[0.98]"
    >
      Back home
    </a>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  document.addEventListener("DOMContentLoaded", () => {
    if (!window.gsap) return;
    const card = document.getElementById("error-card");

    if (window.prefersReducedMotion) {
      gsap.set(card, { opacity: 1, y: 0 });
      return;
    }

    gsap.fromTo(card, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" });
  });
</script>
{% endblock %}
