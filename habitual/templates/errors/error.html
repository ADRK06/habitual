{% extends "base.html" %}

{% block title %}{{ title }} · Habitual{% endblock %}

{% block content %}
<div class="relative flex min-h-screen items-center justify-center overflow-hidden px-4 py-12">
  <div data-glow="accent" class="pointer-events-none absolute -top-32 -right-24 h-80 w-80 rounded-full bg-accent/20 blur-3xl"></div>
  <div data-glow="rooms" class="pointer-events-none absolute -bottom-32 -left-24 h-80 w-80 rounded-full bg-rooms/20 blur-3xl"></div>

  <div id="error-card" class="relative w-full max-w-sm rounded-2xl border border-border bg-surface/60 backdrop-blur-xl p-8 text-center shadow-2xl shadow-black/20">
    <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-accent/10 text-3xl">{{ emoji }}</div>
    <p class="mt-4 font-heading text-5xl font-bold tabular-nums text-accent">{{ code }}</p>
    <h1 class="mt-2 font-heading text-xl font-semibold text-text">{{ title }}</h1>
    <p class="mt-2 text-sm text-text-muted">{{ message }}</p>
    <a
      href="{{ url_for('home') }}"
      class="mt-6 inline-block w-full rounded-2xl bg-accent px-4 py-2 font-medium text-bg transition-transform duration-150 hover:opacity-90 hover:scale-[1.02] active:scale-[0.98]"
    >
      Back home
    </a>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  document.addEventListener("DOMContentLoaded", () => {
    if (!window.gsap) return;
    const card = document.getElementById("error-card");

    if (window.prefersReducedMotion) {
      gsap.set(card, { opacity: 1, y: 0 });
      return;
    }

    gsap.fromTo(card, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" });
    gsap.to('[data-glow="accent"]', { x: -30, y: 20, duration: 9, repeat: -1, yoyo: true, ease: "sine.inOut" });
    gsap.to('[data-glow="rooms"]', { x: 25, y: -15, duration: 11, repeat: -1, yoyo: true, ease: "sine.inOut" });
  });
</script>
{% endblock %}
